# devbox/mise.toml — point d'entrée local, toujours à jour avant d'exécuter.
#
#   mise run bootstrap                    git pull --ff-only puis ./bootstrap.sh
#   mise run bootstrap -- -n              idem, en dry-run
#   mise run bootstrap -- --only ssh      idem, une seule étape
#   mise run pull                         juste la mise à jour, sans lancer bootstrap
#   mise run bootstrap-only -- -n         lance bootstrap.sh sans pull (offline/debug)
#   mise run sync                         bootstrap sur toutes les machines tag:omarchy
#   mise run hooks                        active le hook post-commit (push + sync auto)
#   mise run socks5-test [hôte] [port]    teste le proxy SOCKS5 (--with-socks5)
#   mise run upgrade [-- -n]              met à jour pacman, AUR, mise, claude (-n : dry-run)
#   mise run packages [-- -n]             installe packages.txt sur ce poste (+ AUR, twg), sans pull
#   mise run pkg-commit [-- -n]           commite packages.txt, message généré depuis le diff (-n : l'affiche)
#   mise run warp-reauth [hôte] [url]     ré-auth WARP sur l'hôte distant (fonction de la couche privée)

[tasks.pull]
description = "git pull --ff-only"
run = "git pull --ff-only"

[tasks.bootstrap-only]
description = "./bootstrap.sh, sans pull"
run = "./bootstrap.sh"

[tasks.bootstrap]
description = "git pull puis ./bootstrap.sh"
depends = ["pull"]
run = "./bootstrap.sh"

[tasks.sync]
description = "rejoue le bootstrap sur toutes les machines tag:omarchy"
run = "./sync-fleet.sh"

[tasks.hooks]
description = "active le hook post-commit (push + sync de la flotte)"
run = "git config core.hooksPath hooks"

[tasks.socks5-test]
description = "teste le proxy SOCKS5 tailnet (défaut : ce nœud, port 1080)"
run = "./socks5-test.sh"

[tasks.packages]
description = "installe packages.txt sur ce poste (étape packages du bootstrap, sans pull)"
run = "./bootstrap.sh --only packages"

[tasks.pkg-commit]
description = "commite packages.txt avec un message généré (« paquets : + x, − y »)"
run = "./pkg-commit.sh"

[tasks.upgrade]
description = "met à jour pacman, AUR (yay), mise, claude (-n : dry-run)"
run = "./upgrade.sh"

# L'hôte et l'URL sont privés : la tâche ne fait qu'appeler `warp-reauth`,
# définie dans la couche privée (~/.config/devbox/private/rc.d/).
[tasks.warp-reauth]
description = "ré-authentifie WARP sur l'hôte distant, puis teste GitLab (couche privée)"
run = """bash -c 'source overlay/bash/rc.d/90-private.sh; declare -F warp-reauth >/dev/null || { echo "warp-reauth absent : couche privée non clonée (mise run bootstrap)" >&2; exit 1; }; warp-reauth "$@"' warp-reauth"""
