# devbox — ajouts à la config tmux d'Omarchy, chargés en fin de tmux.conf
# (ligne `source-file -q ~/.config/tmux/devbox.conf` posée par bootstrap.sh).

# Liens cliquables (OSC 8) et séquences passées au terminal hôte (images, notifs)
# à travers tmux, y compris via SSH.
set -as terminal-features ',*:hyperlinks'
set -g allow-passthrough on

# tmux-agent-sidebar : un volet qui suit tous les Claude Code / Codex / OpenCode
# de toutes les sessions. prefix+e : bascule dans la fenêtre, prefix+E : partout.
# Options (@sidebar_width, @sidebar_position…) à régler AVANT le run-shell.
# Plugin et binaire installés par l'étape `tmux` de bootstrap.sh.
# Panneau du bas (Activity / Git) masqué : 0 = caché, sinon hauteur en lignes.
set -g @sidebar_bottom_height 0
# Pas de volet permanent dans chaque nouvelle fenêtre : on passe par le popup.
set -g @sidebar_auto_create off
if-shell 'test -x ~/.tmux/plugins/tmux-agent-sidebar/tmux-agent-sidebar.tmux' \
  'run-shell ~/.tmux/plugins/tmux-agent-sidebar/tmux-agent-sidebar.tmux'

# Popup flottant (patch 0003) : prefix+a ouvre la liste au centre ;
# Entrée saute au Claude choisi et ferme, Esc ou q ferme sans sauter.
# run-shell pour que #{pane_id} / #{client_name} soient développés. Le popup
# s'ouvre toujours sur le filtre « tous » : un filtre resté sur ✕ ou ◐ à 0
# donnait une liste vide.
bind -N "Claude : liste des sessions (popup)" a run-shell -b 'tmux set -g @sidebar_filter all; tmux display-popup -c "#{client_name}" -E -w 70% -h 80% -T " Claude " -e AGENT_SIDEBAR_POPUP=1 -e TMUX_PANE=#{pane_id} -e "AGENT_SIDEBAR_CLIENT=#{client_name}" "#{@agent_sidebar_bin}"'
