# devbox — ajouts à la config tmux d'Omarchy, chargés en fin de tmux.conf
# (ligne `source-file -q ~/.config/tmux/devbox.conf` posée par bootstrap.sh).

# tmux-agent-sidebar : un volet qui suit tous les Claude Code / Codex / OpenCode
# de toutes les sessions. prefix+e : bascule dans la fenêtre, prefix+E : partout.
# Options (@sidebar_width, @sidebar_position…) à régler AVANT le run-shell.
# Plugin et binaire installés par l'étape `tmux` de bootstrap.sh.
if-shell 'test -x ~/.tmux/plugins/tmux-agent-sidebar/tmux-agent-sidebar.tmux' \
  'run-shell ~/.tmux/plugins/tmux-agent-sidebar/tmux-agent-sidebar.tmux'
